# Mail server controls for mail.jawaninvest.com (Bluehost 162.241.216.206).
# Shared hosting cannot edit /etc/exim.conf. Open a Bluehost support ticket
# and ask them to apply this. On VPS/dedicated, use WHM > Exim Configuration
# Manager > Advanced Editor.
#
# These ACLs reject unauthenticated mail. They do not describe how to send it.

# --- Exim main section ---
smtp_banner = $smtp_active_hostname ESMTP
pipelining_advertise_hosts =
pipelining_connect_advertise_hosts =
# Remove port 26 from public listeners if this host is a VPS:
# daemon_smtp_ports = 25 : 465 : 587

# --- acl_smtp_rcpt (near the top, after relay_from_hosts / authenticated accept) ---
deny
  message = Authentication is required to send mail as this domain
  !authenticated = *
  !hosts = +relay_from_hosts
  sender_domains = +local_domains

deny
  message = Null envelope sender is not accepted from this host
  !authenticated = *
  !hosts = +relay_from_hosts
  senders = :

# --- acl_smtp_data ---
warn
  !authenticated = *
  !hosts = +relay_from_hosts
  remove_header = bcc : return-path

# --- Dovecot (/etc/dovecot/dovecot.conf), then restart dovecot ---
# disable_plaintext_auth = yes
# ssl = required

# --- Firewall ---
# Close public access to 2083, 2087, 2096, 3306, and 5432 except office IPs.
# cPanel > Security > IP Deny Manager, or ConfigServer Security Firewall.
# Disable anonymous FTP in cPanel > FTP Accounts.
# MySQL: cPanel > Remote MySQL > remove remote hosts.
# PostgreSQL: listen_addresses = localhost
