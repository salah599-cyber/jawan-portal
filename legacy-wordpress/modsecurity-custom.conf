# Custom ModSecurity rules for mail.jawaninvest.com.
# cPanel: Security > ModSecurity > Rules > Add Custom Rule, or include this
# file from the vhost if the account can load custom CRS rules.
# Do not add User-Agent allowlist exceptions. Remove any existing
# SecRuleRemoveById / SecRuleRemoveByTag rules that skip CRS checks
# because the client sent a particular User-Agent.

SecRule REQUEST_FILENAME "@endsWith /xmlrpc.php" \
  "id:1001001,phase:1,deny,status:403,t:none,log,msg:'XML-RPC is disabled'"

SecRule ARGS_NAMES "@rx (?i)^rest_route$" \
  "id:1001002,phase:2,deny,status:403,t:none,log,msg:'rest_route bypass blocked'"

SecRule ARGS_NAMES "@rx (?i)^_envelope$" \
  "id:1001003,phase:2,deny,status:403,t:none,log,msg:'REST envelope blocked'"

SecRule QUERY_STRING "@rx (?i)(?:^|&)author=" \
  "id:1001004,phase:1,deny,status:403,t:none,log,msg:'Author enumeration blocked'"
